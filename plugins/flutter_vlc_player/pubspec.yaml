name: flutter_vlc_player
description: A VLC-powered alternative to Flutter's video_player. Supports multiple players on one screen.
# Vendored copy of flutter_vlc_player 7.4.4 (pub.dev), patched to build with AGP 9.
# See plugins/flutter_vlc_player/android/build.gradle for the local changes.
version: 7.4.4
homepage: https://github.com/solid-software/flutter_vlc_player/
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.13.3 <4.0.0"

flutter:
  plugin:
    platforms:
      android:
        package: software.solid.fluttervlcplayer
        pluginClass: FlutterVlcPlayerPlugin
      ios:
        pluginClass: FlutterVlcPlayerPlugin

dependencies:
  flutter:
    sdk: flutter

  flutter_vlc_player_platform_interface: ^2.0.5
  meta: ^1.8.0
